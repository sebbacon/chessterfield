{% extends "admin/base_site.html" %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    .puzzle-processing-shell {
      max-width: 44rem;
    }
    .puzzle-processing-panel {
      background: #fff;
      border: 1px solid #d8dde6;
      border-radius: 10px;
      padding: 2rem;
      margin-top: 1rem;
      text-align: center;
    }
    .puzzle-spinner {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      border: 4px solid #d8dde6;
      border-top-color: #417690;
      border-radius: 50%;
      animation: puzzle-spin 0.8s linear infinite;
    }
    .puzzle-processing-status {
      color: #44546a;
      margin: 0.5rem 0 0;
    }
    @keyframes puzzle-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
{% endblock %}

{% block content %}
  <div class="puzzle-processing-shell">
    <h1>Processing {{ batch.pages.count }} puzzle page{{ batch.pages.count|pluralize }}</h1>
    <div class="puzzle-processing-panel">
      <div class="puzzle-spinner"></div>
      <p class="puzzle-processing-status" id="processing-status">Extracting boards, reading header metadata, and predicting FENs.</p>
      <form id="processing-form" method="post" action="{{ start_url }}">
        {% csrf_token %}
        <noscript>
          <div class="submit-row">
            <input type="submit" value="Start processing" class="default">
          </div>
        </noscript>
      </form>
    </div>
  </div>
  <script>
    (function () {
      const form = document.getElementById("processing-form");
      const statusNode = document.getElementById("processing-status");
      const csrfToken = form.querySelector("input[name=csrfmiddlewaretoken]").value;

      fetch(form.action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": csrfToken,
          "X-Requested-With": "XMLHttpRequest"
        }
      })
        .then((response) => response.json())
        .then((data) => {
          window.location.assign(data.redirect_url || "{{ review_url }}");
        })
        .catch(() => {
          statusNode.textContent = "Processing failed. Opening the review page so you can inspect the errors.";
          window.setTimeout(() => window.location.assign("{{ review_url }}"), 1200);
        });
    })();
  </script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Chessterfield</title>
</head>
<body>
  <main style="max-width:28rem;margin:4rem auto;font-family:sans-serif">
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
    <p><a href="{% url 'signup' %}">Create an account</a></p>
  </main>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Account{% endblock %} - Chessterfield</title>
  <link rel="stylesheet" href="{% static 'users/auth.css' %}">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-card">
      <a class="auth-backlink" href="/">← Back to Chessterfield</a>
      <div class="auth-brand">
        <p class="auth-eyebrow">Chessterfield</p>
        {% block heading %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
